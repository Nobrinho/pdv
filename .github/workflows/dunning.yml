name: Cobranca (dunning)

# Roda a rotina de cobranca 1x/dia. Nao precisa da API no ar: opera direto
# no banco. So exige o secret DATABASE_URL (connection string do Neon).
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 no horario de Brasilia
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

jobs:
  dunning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias (so producao, sem builds nativos)
        run: npm ci --omit=dev --ignore-scripts
      - name: Rodar cobranca
        run: npm run server:dunning
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BILLING_GRACE_DAYS: "5"
